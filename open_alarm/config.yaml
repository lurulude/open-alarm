name: Open Alarm
version: "0.1.0-beta.2"
slug: open_alarm
description: SCADA-style alarm management for Home Assistant
url: https://github.com/lurulude/open-alarm
arch:
  - aarch64
  - amd64
startup: application
boot: auto
stage: experimental
ingress: true
ingress_port: 8099
panel_icon: mdi:alarm-light
panel_admin: true
homeassistant_api: true
backup: cold
watchdog: http://[HOST]:[PORT:8099]/healthz
init: false
environment:
  OPEN_ALARM_ENFORCE_INGRESS_SOURCE: "1"
options: {}
schema: {}
